<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>승강기 점검일지 찾기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <!-- 승강기 검색을 안내하는 첫 문구 -->
    <section class="search-section" aria-labelledby="page-title">
      <p class="eyebrow">ELEVATOR INSPECTION</p>
      <h1 id="page-title">승강기를 찾으시나요?</h1>
      <p class="description">승강기번호를 입력해 점검일지 결과를 확인해 보세요.</p>

      <!-- 승강기번호를 입력하는 검색창 -->
      <form class="search-form" action="#" method="get" role="search">
        <label class="visually-hidden" for="elevator-number">승강기번호</label>
        <input
          id="elevator-number"
          name="elevator-number"
          type="search"
          placeholder="승강기번호를 입력하세요"
          autocomplete="off"
        >
        <button type="submit">검색</button>
      </form>
    </section>

    <!-- 국가승강기정보센터로 이동하는 링크 -->
    <nav class="links" aria-label="관련 사이트">
      <a class="link-card" href="https://www.elevator.go.kr/" target="_blank" rel="noopener noreferrer">
        <span class="link-label">공식 정보 확인</span>
        <span class="link-title">국가승강기정보센터</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <!-- GitHub 사이트로 이동하는 링크 -->
      <a class="link-card github-card" href="https://github.com/SY2812" target="_blank" rel="noopener noreferrer">
        <span class="link-label">프로젝트 바로가기</span>
        <span class="link-title">GitHub</span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
  </main>
</body>
</html>
